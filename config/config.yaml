# Runtime settings for memory tiers and Copilot invocation.
# You can override these values in ~/.engram/user.config.yaml.

db:
  root_dir: "D:/intel_engram"

semantic_graph:
  embedding_model: "intfloat/multilingual-e5-small"
  embedding_dimension: 384
  similarity_floor: 0.73
  similarity_ceiling: 0.88

memory:
  scope:
    default_main: "default:main"
    default_fallback: "default:main"
    default_global: "global:main"
    project_prefix: "project:"
    discord_prefix: "discord:"
    kg_node_map:
      projectintelcontunuum: graph-memory-roadmap

  short_term:
    limit_turns: 8
    within_minutes: 120
    max_turn_chars: 80

  working:
    ttl_hours: 48
    max_compact_length: 900
    prompt_summary_max_chars: 240
    store_summary_max_chars: 1200
    store_open_intents_max_chars: 600
    user_clip_chars: 120
    assistant_clip_chars: 160

  auto_checkpoint:
    enabled: true
    poll_seconds: 60
    idle_seconds: 1800
    min_user_turns: 5
    # 사용자 timezone은 OS local timezone을 사용한다.
    # 선택값. 비어 있으면 Engram Wiki daily note만 기록한다.
    external_daily_dir: ""

  long_term:
    search_limit: 2
    item_max_chars: 100
    semantic_threshold: 0.78
    raw_min_score: 0.80
    min_score: 0.70
    kg_threshold: 0.81
    project_match_boost: 0.15
    project_mismatch_penalty: 0.15
    unknown_project_penalty: 0.03
    strict_project_scope: true
    hangul_min_token_overlap: 2
    test_episode_max_chars: 120
    test_markers:
      - 테스트
      - test
      - verify
      - placeholder

  ep_to_kg:
    semantic_threshold: 0.82

  graph_retrieval:
    enabled: true
    max_hops: 2
    top_k: 6
    hop_decay: 0.75
    min_score: 0.12
    item_max_chars: 140
    path_max_chars: 180

  wiki_reminder:
    # 세션 시작 시 user_query와 유사한 wiki 노트를 자동 리마인드
    enabled: true
    top_k: 3
    threshold: 0.81
    item_max_chars: 120
    # project 타입은 _kg_context_snippet에서 이미 처리 — 중복 제외
    exclude_types:
      - project

sync:
  # post-session KG sync 워치독 타임아웃 (초). 이 시간 초과 시 강제 취소.
  # 오케스트레이터만 trigger_sync=True로 호출해야 한다; subagent는 trigger_sync=False 전달.
  watchdog_timeout_secs: 240
  # 마지막 sync 완료 후 재실행 최소 간격 (초). 짧은 시간 내 중복 실행 방지.
  cooldown_secs: 300
  # post-session memories 증분 동기화 배치 크기.
  memories_batch_size: 300

mcp:
  # Overlay가 관리하는 MCP HTTP(SSE) 기본 포트.
  http_port: 17385
  # VS Code 재연결 안정성을 위해 기본 전송은 streamable-http 권장.
  # 허용값: sse | streamable-http
  transport: streamable-http
  # Overlay 생존 중 리스너 헬스체크 주기(초).
  healthcheck_interval_secs: 10
  # 연속 실패 횟수 도달 시 MCP + 종속 리스너 재기동.
  # asyncio.to_thread 패치 이전에는 임베딩 로드(20-30초)가 이벤트 루프를 블로킹해
  # 헬스체크 타임아웃을 유발하므로, threshold를 넉넉히 설정한다.
  healthcheck_fail_threshold: 6
  # Overlay 시작 직후 초기화 구간 유예(초).
  healthcheck_start_delay_secs: 20
  # 재기동 난사 방지 최소 간격(초).
  restart_cooldown_secs: 30
  # 재기동 후 리스너 준비 대기 시간(초).
  ready_timeout_secs: 20
  # 원격 인증 리스너(remote_enabled / remote_port)는 overlay 가 프로세스를 띄우므로
  # config/overlay.yaml 의 mcp: 섹션에 있다.

session:
  # CLI 공급자가 시작될 때 자동으로 engram 컨텍스트를 주입할지 여부
  # 활성화 시 세션 시작마다 추가 컨텍스트 토큰이 소모됩니다
  auto_inject: false

directives:
  enforcement:
    mode: hybrid
    pin_top_n: 3
    max_items: 8
    # 상세 절차를 담은 skill로 보내는 핵심 dispatcher는 항목 상한으로 제거하지 않는다.
    pinned_keys:
      - task-workflow-dispatch
      - wiki-workflow-dispatch
      - session-lifecycle-workflow
  policy:
    audit_default_limit: 20
    audit_max_limit: 100
    guidance_level: "warn"  # off | warn | enforce_agents

copilot:
  model: "claude-sonnet-4.6"
  allow_all_tools: true

tools:
  # MCP에 노출하지 않을 툴 목록. 함수 자체는 유지되므로 내부 호출에는 영향 없음.
  # 사용자는 ~/.engram/user.config.yaml의 tools.disabled 로 오버라이드 가능.
  disabled:
    - engram_save_message
    - engram_get_identity
    - engram_get_persona
    - engram_get_themes
    - engram_update_persona
    - engram_get_persona_status
    - engram_apply_reflection
    - engram_prepare_reflection
    - engram_list_memories
    - engram_get_activities
    - engram_status
    - kg_list_nodes
    - kg_semantic_neighbors
    - memories_sync
    - memories_reconcile
    - engram_consult_engram
