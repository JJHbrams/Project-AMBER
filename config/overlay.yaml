# 오버레이 설정
overlay:
  # 캐릭터 이미지 크기: 주 모니터 높이의 비율
  char_height_ratio: 0.125 # 1/8

  # 캐릭터 리소스 탐색 순서:
  # 1) ~/.engram/character/{name}/ 디렉토리 존재 → sequence 설정에 따라 애니메이션
  # 2) resource/character/sequences/{name}/ 디렉토리 존재 → sequence 설정에 따라 애니메이션
  # 3) ~/.engram/character/{name}.png 존재 → 정적 이미지
  # 4) resource/character/static/{name}.png 또는 sets/{name}/character.png → 정적 이미지
  # 5) ~/.engram/overlay.png 존재 → 정적 fallback
  # 6) resource/overlay.png → 최종 fallback
  # 번호 프레임이 있으면 0(없으면 최소 index) 프레임을 기본 이미지로 사용
  character:
    # static | sequence | sprite_grid. Built-in Engram uses its states.png body frames.
    source_mode: "sprite_grid"
    # 유효한 manifest set은 name이 비어 있거나 set과 같을 때 base/VFX 우선 후보가 된다.
    set: "engram"
    name: "engram"
    sequence:
      enabled: true
      trigger_chance: 0.12
      start_index: 0
      end_index: 2
      repeat_count: 3
      interval_min_sec: 0.2
      interval_max_sec: 3.0
      idle_check_interval_sec: 1.0
    # 번호 프레임 idle과 공존하는 합성 VFX. asset이 없으면 조용히 기존 동작만 사용한다.
    effects:
      enabled: true
      # 단일 이미지 본체는 기본적으로 늘리거나 상하 이동하지 않는다. true면 이전 움직임을 복원한다.
      legacy_body_motion: false
      idle_asset: "resource/character/sets/engram/effects/idle.png"
      click_asset: "resource/character/sets/engram/effects/click.png"
      chroma_key: "#010101"
      idle_interval_ms: 2400
      click_frame_ms: 420
      idle_thickness_px: 2
      click_thickness_px: 3
    # states.png는 캐릭터 본체 상태 프레임이다. 공개 bubble event만 상태 선택에 사용한다.
    reactions:
      enabled: true
      pack: "engram"
      apply_to_custom: false
      sprite_sheet: "resource/character/reactions/engram/states.png"
      chroma_key: "#00FF00"
      columns: 6
      rows: 4
      grid:
        columns: 6
        rows: 4
        cell_width: 434
        cell_height: 408
      scale_ratio: 0.38
      dwell_ms: 2400
      debounce_ms: 450
      allow_text_keywords: true

  # 기본 위치: bottom-left 기준 여백 (px)
  char_margin_x: 20
  char_margin_y: 60

  # 채팅 UI 모드
  # - tui: 기존 Windows Terminal(wt) 스폰 방식
  # - bubble: 캐릭터 옆 말풍선 대화창 (기본)
  chat_mode: "bubble"

  # 선택 사항: 독립 실행 렌더러가 loopback Event API v2에 연결하면 공개 메타데이터만 전송한다.
  # 호스트는 렌더러 프로세스나 명령을 실행하지 않는다. 연결된 renderer id와 mode만 저장한다.
  external_renderer:
    selected_renderer_id: ""
    mode: "observer" # observer | replace

  # 단축키
  hotkey: "alt+f12"

terminal:
  # 터미널 크기: 해당 모니터 작업 영역 기준 비율
  width_ratio: 0.20 # 모니터 너비의 20%
  height_ratio: 0.60 # 모니터 높이의 60%

  # 앵커: anchor_x = 터미널 LEFT, anchor_y = 터미널 BOTTOM
  # anchor_y_ratio: 캐릭터 top에서 아래로 char_h * ratio 지점이 터미널 바닥
  anchor_x_ratio: 0.60 # 오버레이 너비의 70% 지점
  anchor_y_ratio: 0.40 # 캐릭터 top에서 30% 아래 (PNG 투명 패딩 보정)

  # 폰트 크기 추정 (cols/rows 계산용, 1920x1080 기준 픽셀)
  base_char_w: 8
  base_char_h: 16
  min_cols: 40
  min_rows: 15

  # 동적 폰트 크기 (WT engram 프로필에 적용)
  base_font_size: 8 # 1080p 기준 폰트 크기
  ref_screen_height: 1080 # 기준 해상도 높이

dashboard:
  # 설정 > 전역에서 켜고 끌 수 있다.
  enabled: true
  port: 8501

bubble:
  # 말풍선 모드(chat_mode: bubble)의 도구 사용 권한 수준
  # - auto: 전부 자동 승인, 승인 풍선 없음 (기본값 — 말풍선 모드는 가볍게 쓰는 게 목적)
  # - confirm_risky: 조회성 도구(Read/Grep/engram_* 조회류 등)는 자동 승인, 쓰기/실행류만 승인 풍선으로 확인
  # - confirm_always: 모든 도구 호출마다 승인 풍선으로 확인
  permission_level: "auto"

  # 대화/입력 풍선은 캐릭터 위가 아니라 옆(화면 중심 반대쪽)에 배치된다.
  # side_gap: 캐릭터와의 좌우 간격(px). anchor_y_ratio: 캐릭터 상단에서 이 비율만큼
  # 내려온 지점에 풍선의 세로 중심을 맞춤(캐릭터 폭/높이 기준 비율 — terminal 섹션과
  # 같은 의미론이지만 x축은 이제 비율이 아니라 고정 간격을 쓴다).
  side_gap: 10
  anchor_y_ratio: 0.30

  # 크기 — 기본 폭은 모니터 비율이 아니라 캐릭터(오버레이 이미지) 폭 기준.
  # 사용자가 각 풍선 우하단 grip을 드래그해서 직접 조절할 수도 있음(그 이후엔 override 유지).
  width_to_char_ratio: 2.6 # 대화/생각/입력창 기본 폭 = char_w * 이 값
  min_width: 160 # px
  # 최대 높이 — 모니터 작업영역 높이 대비 비율. 0이면 무제한.
  speech_max_height_ratio: 0.55 # 응답 풍선: 화면 높이의 55%
  thought_max_height_ratio: 0.30 # 생각 풍선: 화면 높이의 30%

  # 생각 풍선에 무엇을 보여줄지 (설정 창의 "말풍선" 탭에서 조절 가능)
  #   full  = 실제 추론 텍스트를 그대로 표시 (기본)
  #   brief = 항상 "생각 중…" 류 상태 문구만 표시 (추론 텍스트가 와도 축약)
  # CLI가 추론 텍스트를 숨기고 진행 상황(estimated_tokens)만 보내는 경우가 있어,
  # full 이어도 환경에 따라 상태 문구만 보일 수 있다. brief는 그 편차를 없앤다.
  thought_detail: "full"

  # 글꼴/폰트 크기 (설정 창의 "말풍선" 탭에서 조절 가능)
  font_family: "Noto Sans KR Medium" # 대화/생각/입력 풍선 본문 글꼴
  # font_size: 0 이면 자동 — terminal.base_font_size/ref_screen_height 기준 TUI 스케일을
  # 그대로 쓴다(모니터 배율 반영). 양수면 그 크기(px)로 고정한다(모니터 배율 무시).
  font_size: 0

  # 확장 사고(extended thinking) 토큰 예산 — 생각풍선에 모델의 실제 추론 텍스트를
  # 보여주기 위함. 0이면 끔(추론 거의 안 하고 "생각 중…" 자리표시자만 뜸). 값이 클수록
  # 더 깊이 생각하지만 응답이 느려지고 토큰을 더 쓴다. MAX_THINKING_TOKENS env로 전달됨.
  thinking_tokens: 2000

  # 사용자 메시지 에코 말풍선이 입력창 자리에 유지되는 시간(ms) — 이후 페이드아웃,
  # 다음 입력이 오면 즉시 교체.
  echo_dwell_ms: 8000

  # 도구 상태 줄(생각풍선에 병합) 하나가 완료 표시 후 사라지기까지(ms)
  tool_dwell_ms: 1800

  # 생각풍선에 동시에 보여줄 도구 상태 줄 최대 개수 (FIFO)
  tool_stack_max: 3

  # 히스토리 패널 기본값
  history_default_limit: 50
  history_default_within_minutes: 120

  # 능동적 상주(initiative) — 캐릭터가 유휴 상태에서 스스로 말을 건다.
  # "조용함이 기본": 아래 조건을 전부 만족할 때만, 그것도 드물게만 발화한다.
  # (bubble 모드에서만 동작. tui 모드에선 아무 일도 안 함.)
  initiative:
    enabled: false # 마스터 토글. 기본 꺼짐 — 설정/트레이에서 켠다.
    tick_sec: 45 # 유휴 조건을 점검하는 주기(초). 실제 발화는 훨씬 드물다.
    idle_min_sec: 600 # 마지막 상호작용 후 이만큼 지나야 발화 후보(기본 10분)
    min_gap_sec: 1800 # 발화와 발화 사이 최소 간격(기본 30분)
    quiet_start_hour: 22 # 조용한 시간대 시작(포함). start==end면 조용시간 없음.
    quiet_end_hour: 8 # 조용한 시간대 끝(제외). 22→8은 자정을 넘는 구간으로 처리.
    phrasing: true # LLM 프레이징(하이브리드). 끄면 항상 템플릿 문구만 사용.
    phrasing_timeout_sec: 25
    nudge_dwell_ms: 25000 # 능동 발화 풍선이 자동 페이드되기까지(ms)
    ignore_backoff_max: 4 # 연속 무시 시 발화 간격 배수 상한
    # 소스별 on/off + 쿨다운(초). 우선순위: memory → unfinished → curiosity → git → persona.
    sources:
      memory: { enabled: true, cooldown_sec: 3600 } # 기억 도구 이벤트 뒤의 한 번성 대화 신호
      unfinished: { enabled: true, cooldown_sec: 7200 } # 직전 세션의 미완 작업(open_intents)
      curiosity: { enabled: true, cooldown_sec: 3600 } # 미해결 호기심
      git: { enabled: true, cooldown_sec: 5400 } # 작업 디렉토리 미커밋/미push
      persona: { enabled: true, cooldown_sec: 10800 } # 정체성 기반 혼잣말(프레이징 필요)

cli:
  # 오버레이에서 스폰할 CLI provider 선택
  # - copilot: ~/.engram/engram.cmd 실행
  # - claude-code: ~/.engram/engram-claude.cmd 실행 (없으면 claude)
  #   * ollama_model이 설정되어 있으면 claude --model <ollama_model> 로 실행
  #   * model이 Claude alias/id가 아니면 ollama_base_url을
  #     ANTHROPIC_BASE_URL로 주입해 로컬 Ollama 라우팅
  #   * model이 tools capability가 없으면
  #     claude_ollama_no_tools_fallback(ollama|none)에 따라 동작
  # - antigravity: ~/.engram/engram-antigravity.cmd 실행 (없으면 antigravity_command)
  # - codex: ~/.engram/engram-codex.cmd 실행 (없으면 codex_command)
  # - claude-code-ollama: 선택된 ollama_model을 Claude Code 백엔드 모델로 강제 사용
  # - ollama: ollama_command run <ollama_model> 실행
  # workdir는 미지정 시 ~/.engram/user.config.yaml 의 workdir를 사용
  # workdir: "C:/Users/yourname/path/to/project"
  provider: "copilot"
  antigravity_command: "agy"
  codex_command: "codex"
  ollama_command: "ollama"
  # ollama_model: "gemma3:4b-it-qat" # gemma3 tool 지원 X
  ollama_model: "qwen3.5:4b"
  ollama_base_url: "http://localhost:11434"
  claude_ollama_no_tools_fallback: "ollama"

discord:
  # Discord Bot 설정
  # bot_token은 환경변수 DISCORD_BOT_TOKEN 에서 읽음 (여기에 직접 입력하지 말 것)
  guild_id: "" # 단일 서버 ID (하위호환)
  # 여러 서버 허용 시 guild_ids 사용 (guild_id와 합집합으로 적용)
  guild_ids: []
  channel_id: "" # 단일 수신 채널 ID (하위호환)
  # 여러 채널 허용 시 channel_ids 사용 (channel_id와 합집합으로 적용)
  channel_ids: []
  # 허용된 사용자 ID 목록 (빈 리스트면 전체 허용 — 권장하지 않음)
  allowed_user_ids: []
  # 라우팅 단위 provider override
  # - 기본은 cli.provider(또는 runtime state 마지막 값)
  # - channel_cli_overrides, guild_cli_overrides가 있으면 해당 값 우선
  # 예시:
  # channel_cli_overrides:
  #   "123456789012345678": "antigravity"
  # guild_cli_overrides:
  #   "987654321098765432": "ollama"
  channel_cli_overrides: {}
  guild_cli_overrides: {}
  # 라우팅 단위 scope_key override (세션 분리 규칙)
  # 우선순위:
  # 1) channel_scope_overrides[channel_id]
  # 2) guild_scope_overrides[guild_id]
  # 3) scope_key_template
  # 4) 기본값: "{prefix}{channel_id}" (prefix = memory.scope.discord_prefix)
  # 템플릿 토큰: {prefix}, {guild_id}, {channel_id}, {route_id}
  # 예시:
  # scope_key_template: "{prefix}g:{guild_id}:c:{channel_id}"
  # channel_scope_overrides:
  #   "123456789012345678": "{prefix}team-alpha"
  # guild_scope_overrides:
  #   "987654321098765432": "{prefix}guild:{guild_id}"
  scope_key_template: ""
  channel_scope_overrides: {}
  guild_scope_overrides: {}
  # 차단할 대상 ID 목록 (allowlist보다 우선 적용)
  deny_guild_ids: []
  deny_channel_ids: []
  deny_user_ids: []
  # 입력 큐 정책
  queue:
    # 채널별 대기 큐 최대 길이
    max_per_channel: 8
    # 큐에서 대기 가능한 최대 시간(초)
    ttl_seconds: 180
    # 큐 포화 시 정책: drop_oldest | drop_newest
    drop_policy: "drop_oldest"
    # 채널 간 동시 처리 worker 수 제한
    max_parallel_channels: 3
    # 대기열 안내 메시지 전송 여부
    notify_waiting: true
    # 안내 메시지를 보내기 시작할 채널 내 대기 순번
    wait_notice_min_position: 2
    # 같은 채널에 대기열 안내를 다시 보내기까지 최소 간격(초)
    wait_notice_cooldown_seconds: 20
    # TTL 초과로 만료된 요청에 안내 메시지 전송 여부
    notify_ttl_expired: true
  # 명시적 새 세션 전환 명령.
  # - 단일 토큰 트리거는 "/new 질문" 처럼 명령+질문 동시 입력 가능
  # - 공백이 포함된 트리거는 완전 일치일 때만 동작
  new_session_triggers:
    - "/new"
    - "/newsession"
    - "/새세션"

mcp:
  # overlay.exe가 소유하는 지속 MCP HTTP(SSE) 서버
  # Copilot CLI는 SSE, Antigravity는 Streamable HTTP /mcp로 이 포트에 연결
  http_port: 17385
  transport: "streamable-http"
  # frozen 첫 실행은 OS/백신의 모듈 스캔으로 1분 이상 걸릴 수 있다.
  # 준비 전 health monitor가 정상 프로세스를 재시작하지 않도록 충분히 유예한다.
  healthcheck_interval_secs: 10
  healthcheck_fail_threshold: 6
  healthcheck_start_delay_secs: 180
  restart_cooldown_secs: 30
  ready_timeout_secs: 120
  # python_exe: ""  # overlay.exe(동결) 모드에서 자동 감지 안 되면 직접 지정
  # python_exe: "C:/Users/yourname/miniconda3/envs/intel_engram/python.exe"
  #
  # 원격(SSH 리버스 터널) 전용 인증 리스너.
  # http_port 는 loopback 무인증을 유지한다 — 로컬 호출자는 이미 로컬 실행 권한이
  # 있으므로 인증을 걸어도 얻는 게 없다. 터널 너머는 그 전제가 깨지므로,
  # 터널은 반드시 remote_port 에만 연결하고 bearer 토큰으로 인증한다.
  #   토큰     : ~/.engram/mcp-tokens.yaml
  #   감사 로그: ~/.engram/logs/remote-audit.jsonl
  remote_enabled: false
  remote_port: 17386
